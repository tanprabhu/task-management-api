[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "task-management-api"
version = "0.1.0"
description = "Cloud-native task management REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.0,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "email-validator>=2.0,<3.0",
    "pwdlib[argon2]",
    "PyJWT>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["migrations", "migrations.*", "tests", "tests.*"]